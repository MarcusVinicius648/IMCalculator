<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orelega+One&display=swap');
  </style>

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <title>IMCalculator</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <h1> IMC<span class="secondTitle">alculator</span></h1>

  
    <div class="inputs">

      <label for="height">Altura:</label>
      <input type="number" id="height" name="height" placeholder="em Metros">
      <i class="material-icons">fitness_center</i>

      <br>

      <label for="weight">Peso: </label>
      <input type="number" id="weight" name="weight" placeholder="em Kilogramas">
      <i class="material-icons">hail</i>

    </div>

    <button id="button">Calcular</button>

    <p id="result"></p>


  <footer>
    <p>Marcus Vinicius - 2021</p>
  </footer>
  <script src="./script.js"></script>

</body>

</html>
